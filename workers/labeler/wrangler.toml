name = "fomometer-labeler"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Cron — every 15 minutes. Each run labels events whose 4h-lookahead window
# has just closed (and back-fills 15m / 1h windows that closed earlier).
[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "fomometer"
database_id = "9ac47005-db06-43e5-8a79-87e8d0b0acf8"

[vars]
LABELER_LOOKBACK_HOURS = "12"
LABELER_BATCH_SIZE = "500"
