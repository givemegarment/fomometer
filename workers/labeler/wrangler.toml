name = "fomometer-labeler"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Cron every minute: swaps every run; labeling (events whose 4h-lookahead window has just
# closed, plus 15m / 1h back-fills) on minutes divisible by 15 (src/index.ts LABEL_EVERY_MIN).
[triggers]
crons = ["*/1 * * * *"]

# Keep run logs (console.log lines) in the dashboard, so failures are visible after the fact.
[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "fomometer"
database_id = "9ac47005-db06-43e5-8a79-87e8d0b0acf8"

[vars]
LABELER_LOOKBACK_HOURS = "12"
LABELER_BATCH_SIZE = "500"
# Signals written to Solana as memos (src/record.ts). "true" only after the record wallet is
# funded and the owner starts it; the keypair is the secret CHAIN_RECORD_KEY.
CHAIN_RECORD_ENABLED = "true"
# X account (src/social.ts): "off", "dry" (build and log posts, no X calls) or "live". Keys are the secrets
# X_API_KEY, X_API_SECRET, X_ACCESS_TOKEN, X_ACCESS_SECRET. Monthly cap: new signals stop first.
X_POST_MODE = "live"
X_MONTHLY_CAP = "1300"
SITE_URL = "https://fomometer.xyz"
# Swaps that paid the referral fee (src/swaps.ts). Public values; the referral account
# and fee must match apps/web/lib/trade.ts. The RPC below is the fallback: Cloudflare's
# network is refused by public RPCs, so production uses the HELIUS_API_KEY secret.
SOLANA_RPC_URL = "https://solana-rpc.publicnode.com"
JUP_REFERRAL_ACCOUNT = "Fyhr9NJU2JbwdTL4ZZRRaCpnJH1eLydDnBZsc9khJBTA"
JUP_REFERRAL_FEE_BPS = "100"
# Fee token accounts owned by the referral account (SOL, USDC, USDT, cbBTC, jlUSDC, HYPE,
# SPCX, PYUSD, PUMP). Add one here when a new fee mint is created on referral.jup.ag.
